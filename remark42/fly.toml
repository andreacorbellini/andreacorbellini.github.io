app = "remark42"

[build]
image = "umputun/remark42:latest"

[checks.httpget]
interval = "15s"
method = "GET"
path = "/ping"
port = 8080
timeout = "10s"
type = "http"

[env]
ADMIN_SHARED_ID = "email_934f97c0d0faf1caf7345488a70767a2b68ef728"
ALLOWED_HOSTS = "'self',https://andrea.corbellini.blog,https://comments.andrea.corbellini.blog"
ANON_VOTE = "true"
AUTH_ANON = "true"
AUTH_EMAIL_ENABLE = "true"
AUTH_EMAIL_FROM = "andrea@corbellini.blog"
AUTH_SEND_JWT_HEADER = "true"
NOTIFY_ADMINS = "email"
NOTIFY_EMAIL_FROM = "andrea@corbellini.blog"
NOTIFY_USERS = "email"
REMARK_URL = "https://comments.andrea.corbellini.blog/"
SITE = "andrea.corbellini.blog"
SMTP_HOST = "live.smtp.mailtrap.io"
SMTP_PORT = "587"
SMTP_STARTTLS = "true"
SMTP_USERNAME = "api"

[[mounts]]
destination = "/srv/var"
source = "remark42_db_0"

[[services]]
internal_port = 8_080
protocol = "tcp"

[[services.ports]]
handlers = [ "tls", "http" ]
port = 443

[[services.ports]]
handlers = [ "http" ]
port = 80
